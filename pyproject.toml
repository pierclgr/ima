[project]
name = "decision-engine"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "flash-linear-attention>=0.5.2",
    "peft>=0.21.2",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "modal>=1.6.1",
    "pytest>=9.1.1",
]
